<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AIKEN VAPE & TOBACCO | تسجيل الدخول</title>
  <!-- Font Awesome للأيقونات -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ============================
       CSS Variables & Global Reset
       ============================ */
    :root {
      --neon-green: #86D800;
      --neon-green-glow: rgba(134, 216, 0, 0.7);
      --neon-green-soft: rgba(134, 216, 0, 0.15);
      --electric-purple: #6210A2;
      --purple-glow: rgba(98, 16, 162, 0.8);
      --pure-black: #000000;
      --white: #ffffff;
      --gray-light: #cccccc;
      --gray-mid: #888888;
      --gray-dark: #1a1a1a;
      --glass-bg: rgba(10, 10, 10, 0.55);
      --glass-border: rgba(134, 216, 0, 0.3);
      --glass-border-hover: rgba(134, 216, 0, 0.7);
      --input-bg: rgba(20, 20, 20, 0.6);
      --input-border: rgba(255, 255, 255, 0.1);
      --body-bg: var(--pure-black);
      --text-color: var(--white);
      --font-heading: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      --font-body: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      --transition-fast: 0.2s ease;
      --transition-smooth: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 50%;
    }

    /* الوضع النهاري */
    :root.light-mode {
      --neon-green: #5bb900;
      --neon-green-glow: rgba(91, 185, 0, 0.5);
      --neon-green-soft: rgba(91, 185, 0, 0.1);
      --electric-purple: #6b21a8;
      --pure-black: #f3f5f7;
      --white: #101828;
      --gray-light: #333333;
      --gray-mid: #667085;
      --gray-dark: #ffffff;
      --glass-bg: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(91, 185, 0, 0.3);
      --glass-border-hover: rgba(91, 185, 0, 0.7);
      --input-bg: rgba(255, 255, 255, 0.8);
      --input-border: rgba(0, 0, 0, 0.1);
      --body-bg: #f3f5f7;
      --text-color: #101828;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-body);
      background: var(--body-bg);
      color: var(--text-color);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.3s, color 0.3s;
    }

    #particlesCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(134, 216, 0, 0.08) 0%, transparent 55%),
        radial-gradient(ellipse at 70% 70%, rgba(98, 16, 162, 0.1) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 50%, rgba(134, 216, 0, 0.03) 0%, transparent 70%);
      transition: background 0.3s;
    }
    :root.light-mode .bg-glow {
      background:
        radial-gradient(ellipse at 30% 20%, rgba(91, 185, 0, 0.06) 0%, transparent 55%),
        radial-gradient(ellipse at 70% 70%, rgba(107, 33, 168, 0.05) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 50%, rgba(91, 185, 0, 0.02) 0%, transparent 70%);
    }

    /* ============================
       Top Controls (Theme & Language)
       ============================ */
    .top-controls {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    html[dir="ltr"] .top-controls {
      right: auto;
      left: 20px;
    }
    .control-btn {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-color);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition-smooth);
      font-size: 1.1rem;
      position: relative;
    }
    .control-btn:hover {
      border-color: var(--glass-border-hover);
      color: var(--neon-green);
      transform: scale(1.05);
    }
    .lang-dropdown {
      position: relative;
    }
    .lang-menu {
      position: absolute;
      top: 120%;
      right: 0;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      list-style: none;
      padding: 5px 0;
      min-width: 110px;
      display: none;
      z-index: 101;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    html[dir="ltr"] .lang-menu {
      right: auto;
      left: 0;
    }
    .lang-dropdown.active .lang-menu {
      display: block;
    }
    .lang-menu li {
      padding: 8px 10px;
      font-size: 0.9rem;
      color: var(--text-color);
      cursor: pointer;
      transition: 0.3s;
    }
    .lang-menu li:hover {
      background: rgba(134, 216, 0, 0.15);
      color: var(--neon-green);
    }
    .lang-menu li.active-lang {
      color: var(--neon-green);
      font-weight: bold;
    }

    /* ============================
       Main Container
       ============================ */
    .login-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 460px;
      padding: 20px;
    }

    .login-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      position: relative;
      border: 1px solid var(--glass-border);
      box-shadow:
        0 0 20px rgba(134, 216, 0, 0.1),
        0 25px 50px rgba(0, 0, 0, 0.5);
      transition: border-color var(--transition-smooth), box-shadow var(--transition-smooth);
      color: var(--text-color);
    }

    .login-card::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: calc(var(--radius-lg) + 2px);
      padding: 2px;
      background: conic-gradient(from 0deg,
          transparent 0deg,
          rgba(134, 216, 0, 0.4) 90deg,
          transparent 180deg,
          rgba(98, 16, 162, 0.4) 270deg,
          transparent 360deg);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      z-index: -1;
      pointer-events: none;
    }

    .login-card:hover {
      border-color: var(--glass-border-hover);
      box-shadow:
        0 0 40px rgba(134, 216, 0, 0.15),
        0 30px 60px rgba(0, 0, 0, 0.6);
    }

    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }

    .logo-ring {
      width: 100px;
      height: 100px;
      border-radius: var(--radius-xl);
      padding: 5px;
      background: var(--neon-green);
      box-shadow: 0 0 20px var(--neon-green-glow);
      transition: transform var(--transition-smooth), box-shadow var(--transition-smooth);
      cursor: pointer;
    }

    .logo-ring:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px var(--neon-green-glow);
    }

    .logo-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: var(--radius-xl);
      display: block;
      border: 2px solid rgba(0, 0, 0, 0.6);
      background: var(--pure-black);
    }

    .brand-name {
      text-align: center;
      margin-bottom: 6px;
    }

    .brand-name h1 {
      font-family: var(--font-heading);
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--neon-green);
      text-shadow: 0 0 15px var(--neon-green-glow);
      margin: 0;
      line-height: 1.1;
    }

    .brand-tagline {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-tagline span {
      font-family: var(--font-heading);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: var(--gray-mid);
      position: relative;
      display: inline-block;
    }

    /* ============================
       Form Elements
       ============================ */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .input-group {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      right: 16px;
      z-index: 3;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    html[dir="ltr"] .input-icon {
      right: auto;
      left: 16px;
    }

    .input-icon svg {
      width: 20px;
      height: 20px;
      stroke: var(--gray-mid);
      fill: none;
      stroke-width: 1.8;
      transition: stroke var(--transition-smooth);
    }

    .input-field {
      width: 100%;
      padding: 16px 48px 16px 16px;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: var(--radius-md);
      color: var(--text-color);
      font-size: 1rem;
      font-family: var(--font-body);
      transition: all var(--transition-smooth);
      outline: none;
      letter-spacing: 0.5px;
    }
    html[dir="ltr"] .input-field {
      padding: 16px 16px 16px 48px;
    }

    .input-field:focus {
      border-color: var(--neon-green);
      background: var(--input-bg);
    }

    .input-field:focus~.input-icon svg,
    .input-group:focus-within .input-icon svg {
      stroke: var(--neon-green);
    }

    /* ============================
       Floating Label Styles
       ============================ */
    .input-group label {
      position: absolute;
      right: 48px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      z-index: 2;
      font-size: 1rem;
      font-family: var(--font-body);
      color: var(--gray-mid);
      background: transparent;
      padding: 0 4px;
      transition: all var(--transition-smooth);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    html[dir="ltr"] .input-group label {
      right: auto;
      left: 48px;
    }

    .input-group:focus-within label,
    .input-group.has-value label {
      top: -10px;
      transform: translateY(0);
      font-size: 0.75rem;
      color: var(--neon-green);
      background: var(--body-bg);
      padding: 0 6px;
      border-radius: 4px;
      right: 44px;
    }
    html[dir="ltr"] .input-group:focus-within label,
    html[dir="ltr"] .input-group.has-value label {
      right: auto;
      left: 44px;
    }

    .toggle-password {
      position: absolute;
      left: 12px;
      z-index: 3;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    html[dir="ltr"] .toggle-password {
      left: auto;
      right: 12px;
    }

    .toggle-password svg {
      width: 20px;
      height: 20px;
      stroke: var(--gray-mid);
      fill: none;
      stroke-width: 1.8;
      transition: stroke var(--transition-smooth);
    }

    .toggle-password:hover svg {
      stroke: var(--neon-green);
    }

    .input-field.error {
      border-color: #ff3b3b !important;
      animation: shake 0.5s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* ============================
       Buttons
       ============================ */
    .btn-login {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--neon-green) 0%, #6db800 100%);
      color: #000;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 2px;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      position: relative;
      transition: all var(--transition-smooth);
      text-transform: uppercase;
      font-family: var(--font-heading);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 6px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(134, 216, 0, 0.4);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(0, 0, 0, 0.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn-google {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid var(--input-border);
      border-radius: var(--radius-md);
      color: var(--text-color);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all var(--transition-smooth);
      margin-top: 16px;
    }
    .btn-google:hover {
      border-color: rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.07);
    }
    .btn-google svg {
      width: 22px;
      height: 22px;
    }

    /* ============================
       Footer Links
       ============================ */
    .footer-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 22px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .footer-link {
      color: var(--gray-mid);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 1px;
      transition: all var(--transition-smooth);
      position: relative;
      cursor: pointer;
      padding: 4px 0;
    }

    .footer-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0%;
      height: 1px;
      background: var(--neon-green);
      transition: width var(--transition-smooth);
    }
    html[dir="rtl"] .footer-link::after {
      left: auto;
      right: 0;
    }
    .footer-link:hover {
      color: var(--neon-green);
    }
    .footer-link:hover::after {
      width: 100%;
    }

    /* ============================
       Toast Notification
       ============================ */
    .toast-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-smooth);
    }

    .toast-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .toast-box {
      background: var(--glass-bg);
      border: 1.5px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 32px 28px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      transform: translateY(20px) scale(0.9);
      transition: transform var(--transition-bounce);
      color: var(--text-color);
    }

    .toast-overlay.active .toast-box {
      transform: translateY(0) scale(1);
    }

    .toast-icon svg {
      width: 50px;
      height: 50px;
      stroke: var(--neon-green);
      fill: none;
      stroke-width: 2;
      margin-bottom: 16px;
    }

    .toast-message {
      color: var(--text-color);
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .toast-close {
      display: inline-block;
      padding: 10px 30px;
      background: transparent;
      border: 1.5px solid var(--neon-green);
      color: var(--neon-green);
      font-weight: 700;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition-smooth);
    }

    .toast-close:hover {
      background: var(--neon-green);
      color: #000;
    }

    @media (max-width: 500px) {
      .login-card { padding: 28px 20px; }
      .brand-name h1 { font-size: 1.8rem; }
      .top-controls {
        top: 10px;
        right: 10px;
      }
      html[dir="ltr"] .top-controls {
        right: auto;
        left: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Animated Particles Background -->
  <canvas id="particlesCanvas" aria-hidden="true"></canvas>
  <div class="bg-glow" aria-hidden="true"></div>

  <!-- Top Controls: Theme Toggle + Language Dropdown -->
  <div class="top-controls">
    <button class="control-btn theme-toggle" id="themeToggle" data-translate-title="theme" title="المظهر">
      <i class="fas fa-moon"></i>
    </button>
    <div class="lang-dropdown" id="langDropdown">
      <button class="control-btn" id="langToggle" data-translate-title="language" title="اللغة">
        <i class="fas fa-globe"></i>
      </button>
      <ul class="lang-menu" id="langMenu">
        <li data-lang="ar" class="active-lang">العربية</li>
        <li data-lang="en">English</li>
      </ul>
    </div>
  </div>

  <!-- Login Card -->
  <div class="login-wrapper">
    <div class="login-card">
      <div class="logo-container">
        <div class="logo-ring">
          <img src="assets/img/logo/favorite-filled.webp" alt="AIKEN Logo" loading="eager"
          onerror="this.style.display='none'; this.parentElement.style.background='#000'; this.parentElement.innerHTML='<span style=display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:#86D800;font-weight:900;font-size:20px;letter-spacing:2px;>AIKEN</span>';">
        </div>
      </div>

      <div class="brand-name">
        <h1>AIKEN</h1>
      </div>
      <div class="brand-tagline">
        <span>VAPE &amp; TOBACCO</span>
      </div>

      <!-- Login Form -->
      <form class="login-form" id="loginForm" novalidate autocomplete="off">
        <div class="input-group">
          <label for="username" data-translate="username_label">اسم المستخدم</label>
          <input type="text" id="username" class="input-field" required autocomplete="username">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="8" r="5"/>
              <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
            </svg>
          </span>
        </div>

        <div class="input-group">
          <label for="password" data-translate="password_label">كلمة المرور</label>
          <input type="password" id="password" class="input-field" required autocomplete="current-password">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <button type="button" class="toggle-password" id="togglePassword">
            <svg id="eyeIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span class="btn-text" data-translate="login_btn">تسجيل الدخول</span>
        </button>
      </form>

      <!-- Google Button -->
      <button type="button" class="btn-google" id="googleBtn">
        <!-- Google icon SVG -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span data-translate="google_btn">المتابعة باستخدام Google</span>
      </button>

      <!-- Footer Links -->
      <div class="footer-links">
        <a class="footer-link" id="forgotPasswordLink" role="button" tabindex="0" data-translate="forgot_password">هل نسيت كلمة المرور؟</a>
        <a href="Register.html" class="footer-link" id="createAccountLink" data-translate="create_account">إنشاء حساب جديد</a>
      </div>
    </div>
  </div>

  <!-- Toast Overlay -->
  <div class="toast-overlay" id="toastOverlay">
    <div class="toast-box" id="toastBox">
      <div class="toast-icon">
        <svg id="toastIconSvg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
      </div>
      <p class="toast-message" id="toastMessage"></p>
      <button class="toast-close" id="toastCloseBtn" data-translate="close">إغلاق</button>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // ============================
      // Translations Object
      // ============================
      const translations = {
        ar: {
          username_label: 'اسم المستخدم',
          password_label: 'كلمة المرور',
          login_btn: 'تسجيل الدخول',
          google_btn: 'المتابعة باستخدام Google',
          forgot_password: 'هل نسيت كلمة المرور؟',
          create_account: 'إنشاء حساب جديد',
          theme: 'المظهر',
          language: 'اللغة',
          close: 'إغلاق',
          demo_system_msg: "صفحة عرض (Demo) فقط. سيتم تفعيل تسجيل الدخول بواسطة Google عند تطوير المشروع الديناميكي وربطه بقاعدة البيانات وخدمات المصادقة.",
          enter_credentials: 'يرجى إدخال اسم المستخدم وكلمة المرور.',
          invalid_credentials: 'اسم المستخدم أو كلمة المرور غير صحيحة.'
        },
        en: {
          username_label: 'Username',
          password_label: 'Password',
          login_btn: 'Login',
          google_btn: 'Continue with Google',
          forgot_password: 'Forgot Password?',
          create_account: 'Create Account',
          theme: 'Theme',
          language: 'Language',
          close: 'Close',
          demo_system_msg: "This is a demo page only. Google login will be activated when the dynamic project is developed and connected to a database and authentication services.",
          enter_credentials: 'Please enter username and password.',
          invalid_credentials: 'Invalid username or password.'
        }
      };

      // ============================
      // DOM Elements
      // ============================
      const loginForm = document.getElementById('loginForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const loginBtn = document.getElementById('loginBtn');
      const btnText = loginBtn.querySelector('.btn-text');
      const togglePasswordBtn = document.getElementById('togglePassword');
      const eyeIcon = document.getElementById('eyeIcon');
      const googleBtn = document.getElementById('googleBtn');
      const forgotLink = document.getElementById('forgotPasswordLink');
      const toastOverlay = document.getElementById('toastOverlay');
      const toastMessage = document.getElementById('toastMessage');
      const toastCloseBtn = document.getElementById('toastCloseBtn');
      const themeToggle = document.getElementById('themeToggle');
      const langToggle = document.getElementById('langToggle');
      const langDropdown = document.getElementById('langDropdown');
      const langMenu = document.getElementById('langMenu');

      // ============================
      // Language Management
      // ============================
      function getCurrentLang() {
        return localStorage.getItem('lang') || 'ar';
      }

      function setLang(lang) {
        localStorage.setItem('lang', lang);
        applyLanguage(lang);
        langDropdown.classList.remove('active');
        document.querySelectorAll('.lang-menu li').forEach(li => {
          li.classList.toggle('active-lang', li.dataset.lang === lang);
        });
      }

      function applyLanguage(lang) {
        const html = document.getElementById('htmlRoot');
        html.setAttribute('lang', lang);
        html.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');

        document.querySelectorAll('[data-translate]').forEach(el => {
          const key = el.getAttribute('data-translate');
          if (translations[lang] && translations[lang][key]) {
            el.innerHTML = translations[lang][key];
          }
        });
        document.querySelectorAll('[data-translate-title]').forEach(el => {
          const key = el.getAttribute('data-translate-title');
          if (translations[lang] && translations[lang][key]) {
            el.setAttribute('title', translations[lang][key]);
          }
        });

        updateFloatingLabel(usernameInput);
        updateFloatingLabel(passwordInput);
      }

      const initialLang = getCurrentLang();
      applyLanguage(initialLang);
      document.querySelectorAll('.lang-menu li').forEach(li => {
        li.classList.toggle('active-lang', li.dataset.lang === initialLang);
      });

      document.querySelectorAll('.lang-menu li').forEach(li => {
        li.addEventListener('click', () => setLang(li.dataset.lang));
      });

      langToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        langDropdown.classList.toggle('active');
      });
      document.addEventListener('click', () => langDropdown.classList.remove('active'));

      // ============================
      // Theme Management
      // ============================
      function getCurrentTheme() {
        return localStorage.getItem('theme') || 'dark';
      }

      function applyTheme(theme) {
        const html = document.getElementById('htmlRoot');
        if (theme === 'light') {
          html.classList.add('light-mode');
          themeToggle.querySelector('i').classList.remove('fa-moon');
          themeToggle.querySelector('i').classList.add('fa-sun');
        } else {
          html.classList.remove('light-mode');
          themeToggle.querySelector('i').classList.remove('fa-sun');
          themeToggle.querySelector('i').classList.add('fa-moon');
        }
      }

      applyTheme(getCurrentTheme());

      themeToggle.addEventListener('click', () => {
        const current = getCurrentTheme();
        const newTheme = current === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', newTheme);
        applyTheme(newTheme);
      });

      // ============================
      // Floating Label State Management
      // ============================
      function updateFloatingLabel(input) {
        const group = input.closest('.input-group');
        if (!group) return;
        if (input.value.trim() !== '') {
          group.classList.add('has-value');
        } else {
          group.classList.remove('has-value');
        }
      }

      usernameInput.addEventListener('input', function() { updateFloatingLabel(this); });
      passwordInput.addEventListener('input', function() { updateFloatingLabel(this); });

      window.addEventListener('load', function() {
        updateFloatingLabel(usernameInput);
        updateFloatingLabel(passwordInput);
      });

      // ============================
      // Canvas Particles Animation
      // ============================
      const canvas = document.getElementById('particlesCanvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      let animationFrameId;
      let canvasWidth, canvasHeight;

      function resizeCanvas() {
        canvasWidth = window.innerWidth;
        canvasHeight = window.innerHeight;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
      }

      class Particle {
        constructor() { this.reset(); }
        reset() {
          this.x = Math.random() * canvasWidth;
          this.y = Math.random() * canvasHeight;
          this.size = Math.random() * 2 + 0.5;
          this.speedX = (Math.random() - 0.5) * 0.4;
          this.speedY = (Math.random() - 0.5) * 0.4;
          this.opacity = Math.random() * 0.4 + 0.1;
          this.color = Math.random() > 0.5 
            ? `rgba(134, 216, 0, ${this.opacity})` 
            : `rgba(98, 16, 162, ${this.opacity})`;
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.x < 0) this.x = canvasWidth;
          if (this.x > canvasWidth) this.x = 0;
          if (this.y < 0) this.y = canvasHeight;
          if (this.y > canvasHeight) this.y = 0;
        }
        draw(ctx) {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.fill();
        }
      }

      function initParticles() {
        particles = [];
        const particleCount = Math.floor((canvasWidth * canvasHeight) / 18000);
        for (let i = 0; i < particleCount; i++) {
          particles.push(new Particle());
        }
      }

      function animateParticles() {
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);
        particles.forEach(p => {
          p.update();
          p.draw(ctx);
        });
        animationFrameId = requestAnimationFrame(animateParticles);
      }

      window.addEventListener('resize', () => {
        resizeCanvas();
        initParticles();
      });
      
      resizeCanvas();
      initParticles();
      animateParticles();

      // ============================
      // Toggle Password Visibility
      // ============================
      const eyeOpenPath = '<circle cx="12" cy="12" r="3"/><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>';
      const eyeClosedPath = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';

      togglePasswordBtn.addEventListener('click', function() {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        eyeIcon.innerHTML = isPassword ? eyeClosedPath : eyeOpenPath;
        updateFloatingLabel(passwordInput);
      });

      // ============================
      // Toast System
      // ============================
      function showToast(message) {
        toastMessage.textContent = message;
        toastOverlay.classList.add('active');
      }

      function hideToast() {
        toastOverlay.classList.remove('active');
      }

      toastCloseBtn.addEventListener('click', hideToast);
      toastOverlay.addEventListener('click', e => { if (e.target === toastOverlay) hideToast(); });

      // ============================
      // Google & Forgot Password Handlers
      // ============================
      googleBtn.addEventListener('click', () => showToast(translations[getCurrentLang()].demo_system_msg));
      
      // توجيه رابط "هل نسيت كلمة المرور؟" إلى صفحة استعادة كلمة المرور
      forgotLink.addEventListener('click', () => {
        window.location.href = 'forgot-password.html';
      });
      forgotLink.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          window.location.href = 'forgot-password.html';
        }
      });

      // ============================
      // Local Login Verification
      // ============================
      loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        usernameInput.classList.remove('error');
        passwordInput.classList.remove('error');

        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();
        
        if (!username) usernameInput.classList.add('error');
        if (!password) passwordInput.classList.add('error');

        if (!username || !password) {
          showToast(translations[getCurrentLang()].enter_credentials);
          return;
        }

        // قراءة البيانات المخزنة من localStorage
        const storedUsername = localStorage.getItem('username') || '';
        const storedEmail = localStorage.getItem('userEmail') || '';
        const storedPassword = localStorage.getItem('userPassword') || '';

        // التحقق من صحة البيانات المدخلة
        const isUsernameMatch = username === storedUsername || username === storedEmail;
        const isPasswordMatch = password === storedPassword;

        if (isUsernameMatch && isPasswordMatch) {
          // تسجيل دخول ناجح
          loginBtn.disabled = true;
          btnText.style.display = 'none';
          const spinner = document.createElement('span');
          spinner.className = 'spinner';
          loginBtn.appendChild(spinner);

          setTimeout(() => {
            localStorage.setItem('isLoggedIn', 'true');
            window.location.href = 'index.html';
          }, 800);
        } else {
          // بيانات غير صحيحة
          showToast(translations[getCurrentLang()].invalid_credentials);
          // إضافة اهتزاز خفيف للحقول
          usernameInput.classList.add('error');
          passwordInput.classList.add('error');
          setTimeout(() => {
            usernameInput.classList.remove('error');
            passwordInput.classList.remove('error');
          }, 600);
        }
      });

    })();
  </script>
</body>
</html>
