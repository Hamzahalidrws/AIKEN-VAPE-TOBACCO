<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلباتي | AIKEN VAPE</title>

    <!--=============== REMIXICONS ===============-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">


    <!--=============== GOOGLE FONTS ===============-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /*=============== VARIABLES CSS ===============*/
        :root {
            --green: #86D800;
            --purple: #6210A2;
            --bg-dark: #050505;
            --bg-card: #111111;
            --bg-alt: #0a0a0a;
            --bg-img: #151515;
            --text-light: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #222222;
            --star-color: #f1c40f;
            --header-bg: #000000;
            --footer-bg: #000000;
            --hover-bg: #222222;
            --tag-bg: #1a1a1a;
            --hero-bg-end: #000000;
            --modal-overlay-bg: rgba(0, 0, 0, 0.8);
            --modal-bg: #111111;
            --modal-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            --sidebar-bg: rgba(0, 0, 0, 0.85);
            --sidebar-text: #ffffff;
            --sidebar-link-hover: rgba(255, 255, 255, 0.1);
            --sidebar-active: rgba(134, 216, 0, 0.15);
            --sidebar-border: rgba(255, 255, 255, 0.12);
            --status-available: #86D800;
            --status-limited: #FFA500;
            --status-out: #FF4444;
            --badge-bg: rgba(0, 0, 0, 0.6);
            --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.3);
            --shadow-card-hover: 0 20px 40px rgba(0, 0, 0, 0.5);
            --body-font: "Poppins", sans-serif;
            --header-height: 3.5rem;
            --transition-speed: 0.3s;
        }

        :root.light-mode {
            --bg-dark: #f3f5f7;
            --bg-card: #ffffff;
            --bg-alt: #e9edf2;
            --bg-img: #f7f8fa;
            --text-light: #101828;
            --text-muted: #667085;
            --border-color: #d9dee7;
            --header-bg: #ffffff;
            --footer-bg: #f8fafc;
            --hover-bg: #eef2f6;
            --tag-bg: #edf1f5;
            --hero-bg-end: #f3f5f7;
            --green: #5bb900;
            --purple: #6b21a8;
            --modal-overlay-bg: rgba(0, 0, 0, 0.6);
            --modal-bg: #ffffff;
            --modal-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            --sidebar-bg: rgba(255, 255, 255, 0.9);
            --sidebar-text: #101828;
            --sidebar-link-hover: rgba(0, 0, 0, 0.06);
            --sidebar-active: rgba(91, 185, 0, 0.12);
            --sidebar-border: rgba(0, 0, 0, 0.1);
            --status-available: #5bb900;
            --status-limited: #e68a00;
            --status-out: #d92d20;
            --badge-bg: rgba(255, 255, 255, 0.85);
            --shadow-card: 0 6px 20px rgba(0, 0, 0, 0.08);
            --shadow-card-hover: 0 16px 32px rgba(0, 0, 0, 0.15);
        }

        /*=============== BASE ===============*/
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            font-family: var(--body-font);
            font-size: 0.938rem;
            background-color: var(--bg-dark);
            color: var(--text-light);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            min-height: 100vh;
            overflow-x: hidden;
        }

        ul {
            list-style: none;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            display: block;
            max-width: 100%;
            height: auto;
        }

        button {
            font-family: var(--body-font);
            cursor: pointer;
            border: none;
            outline: none;
            background: none;
        }

        /*=============== LAYOUT ===============*/
        .main {
            padding-top: calc(var(--header-height) + 2rem);
            padding-bottom: 3rem;
            margin-inline: 1.5rem;
            color: var(--text-light);
            transition: color var(--transition-speed);
        }

        .main__container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /*=============== HEADER ===============*/
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            margin: 1rem;
        }

        .header__container {
            width: 100%;
            height: var(--header-height);
            background-color: var(--header-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-inline: 1rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: background-color var(--transition-speed), border-color var(--transition-speed);
        }

        .header__logo {
            display: flex;
            align-items: center;
            column-gap: 0.5rem;
            color: var(--text-light);
            font-weight: 600;
            font-size: 1rem;
        }

        .header__logo i {
            font-size: 1.5rem;
            color: var(--green);
        }

        .header__toggle {
            width: 40px;
            height: 40px;
            border-radius: 0.75rem;
            font-size: 1.5rem;
            background-color: var(--tag-bg);
            color: var(--text-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color var(--transition-speed), color var(--transition-speed);
        }

        .header__toggle:hover {
            background-color: var(--hover-bg);
        }

        /*=============== SIDEBAR ===============*/
        .sidebar {
            position: fixed;
            top: 0;
            right: -120%;
            bottom: 0;
            width: 280px;
            background-color: var(--sidebar-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            padding: 1.5rem 1rem 2rem;
            margin: 1rem;
            border-radius: 1.25rem;
            border: 1px solid var(--sidebar-border);
            transition: right 0.4s ease;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar.show-sidebar {
            right: 0;
        }

        .sidebar__logo {
            display: flex;
            align-items: center;
            column-gap: 0.75rem;
            color: var(--sidebar-text);
            padding: 0 0 1.25rem 0.5rem;
            font-weight: 600;
            font-size: 1.1rem;
            border-bottom: 1px solid var(--sidebar-border);
            transition: color var(--transition-speed);
        }

        .sidebar__logo i {
            font-size: 1.75rem;
            color: var(--green);
        }

        .sidebar__content {
            display: grid;
            row-gap: 0.4rem;
            padding-top: 1.5rem;
            flex: 1;
        }

        .sidebar__link {
            display: flex;
            align-items: center;
            column-gap: 0.75rem;
            color: var(--sidebar-text);
            padding: 0.75rem 0.9rem;
            border-radius: 0.75rem;
            transition: background-color 0.3s, color 0.3s;
            font-weight: 500;
            font-size: 0.95rem;
            position: relative;
        }

        .sidebar__link i {
            font-size: 1.3rem;
            width: 24px;
            text-align: center;
        }

        .sidebar__link:hover {
            background-color: var(--sidebar-link-hover);
        }

        .sidebar__link.active-link {
            background-color: var(--sidebar-active);
            color: var(--green);
            font-weight: 600;
        }

        .sidebar__link.active-link::before {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 24px;
            background-color: var(--green);
            border-radius: 0 3px 3px 0;
        }

        .sidebar__logout {
            margin-top: auto;
            border-top: 1px solid var(--sidebar-border);
            padding-top: 1rem;
            color: #ff6b6b;
        }

        .sidebar__logout:hover {
            background-color: rgba(255, 107, 107, 0.1);
        }

        /* Dropdown */
        .drop__button {
            width: 100%;
            flex-direction: row;
            border: none;
            outline: none;
            background: none;
            font: 500 0.95rem var(--body-font);
            cursor: pointer;
            color: var(--sidebar-text);
        }

        .drop__arrow {
            margin-right: auto;
            transition: transform 0.4s;
        }

        .drop__list {
            display: grid;
            row-gap: 0.25rem;
            height: 0;
            overflow: hidden;
            transition: height 0.4s;
        }

        .drop__item {
            position: relative;
            display: flex;
            align-items: center;
            column-gap: 0.75rem;
            color: var(--sidebar-text);
            padding: 0.6rem 0.5rem 0.6rem 1.5rem;
            border-radius: 0.6rem;
            transition: background-color 0.3s;
            font-size: 0.9rem;
        }

        .drop__item i {
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
        }

        .drop__item:hover {
            background-color: var(--sidebar-link-hover);
        }

        .show-drop .drop__arrow {
            transform: rotate(-180deg);
        }

        /*=============== PAGE HEADER ===============*/
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text-light);
        }

        .page-title i {
            color: var(--green);
            font-size: 2.2rem;
        }

        .page-count {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 2rem;
            padding: 0.5rem 1.25rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .page-count strong {
            color: var(--green);
            font-size: 1.2rem;
        }

        /*=============== ORDERS LIST ===============*/
        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .order-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
            box-shadow: var(--shadow-card);
            animation: fadeInUp 0.5s ease both;
            animation-delay: calc(var(--i, 0) * 0.05s);
        }

        .order-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-card-hover);
            border-color: var(--green);
        }

        .order-card__header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .order-card__number {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--green);
        }

        .order-card__date {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .order-card__status {
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            font-weight: 600;
            background-color: var(--tag-bg);
            color: var(--text-light);
        }

        .order-card__status.pending { color: #FFA500; }
        .order-card__status.shipping { color: #3498db; }
        .order-card__status.delivered { color: #2ecc71; }
        .order-card__status.cancelled { color: #e74c3c; }

        .order-card__body {
            padding: 1.25rem 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: center;
            justify-content: space-between;
        }

        .order-card__items {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .order-card__item-thumbs {
            display: flex;
            gap: 0.5rem;
        }

        .order-card__thumb {
            width: 45px;
            height: 45px;
            border-radius: 0.5rem;
            overflow: hidden;
            background-color: var(--bg-img);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .order-card__thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .order-card__thumb .placeholder {
            font-size: 1.5rem;
            color: var(--green);
        }

        .order-card__info {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .order-card__total {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--green);
        }

        .order-card__items-count {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .order-card__actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.7rem 1.2rem;
            border-radius: 0.75rem;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .btn-primary {
            background-color: var(--green);
            color: #000000;
            border-color: var(--green);
        }

        .btn-primary:hover {
            background-color: transparent;
            color: var(--green);
            border-color: var(--green);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-muted);
            border-color: var(--border-color);
        }

        .btn-outline:hover {
            border-color: var(--green);
            color: var(--green);
        }

        /*=============== EMPTY STATE ===============*/
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background-color: var(--bg-card);
            border: 1px dashed var(--border-color);
            border-radius: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
            animation: fadeInUp 0.6s ease;
        }

        .empty-state__icon {
            font-size: 5rem;
            color: var(--text-muted);
            opacity: 0.5;
        }

        .empty-state__title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-light);
        }

        .empty-state__desc {
            font-size: 1rem;
            color: var(--text-muted);
            max-width: 400px;
            line-height: 1.6;
        }

        .btn-shop {
            background-color: var(--green);
            color: #000000;
            padding: 0.85rem 2.5rem;
            border-radius: 2rem;
            font-size: 1rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s;
            border: 2px solid var(--green);
        }

        .btn-shop:hover {
            background-color: transparent;
            color: var(--green);
        }

        /*=============== ANIMATION ===============*/
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /*=============== RESPONSIVE ===============*/
        @media screen and (max-width: 768px) {
            .main {
                margin-inline: 1rem;
                padding-top: calc(var(--header-height) + 1.5rem);
            }

            .page-title {
                font-size: 1.5rem;
            }

            .page-title i {
                font-size: 1.7rem;
            }

            .order-card__header,
            .order-card__body {
                padding: 1rem;
            }

            .order-card__body {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .order-card__actions {
                width: 100%;
                justify-content: stretch;
            }

            .order-card__actions .btn {
                flex: 1;
            }
        }

        @media screen and (max-width: 480px) {
            .order-card__header {
                flex-direction: column;
                align-items: flex-start;
            }

            .order-card__items {
                flex-direction: column;
                align-items: flex-start;
            }

            .order-card__item-thumbs {
                flex-wrap: wrap;
            }
        }

        /* For large devices */
        @media screen and (min-width: 1150px) {
            .header {
                margin: 1.5rem;
                padding-right: 300px;
                transition: padding 0.4s;
            }

            .header__container {
                height: calc(var(--header-height) + 2rem);
                padding-inline: 1.5rem;
            }

            .header__toggle {
                display: none;
            }

            .sidebar {
                right: 0;
                width: 280px;
                margin: 1.5rem;
                padding: 2rem 1.5rem;
                border-radius: 1.5rem;
            }

            .main {
                padding-right: 300px;
                padding-top: calc(var(--header-height) + 3rem);
                transition: padding 0.4s;
            }
        }

        @media screen and (max-width: 320px) {
            .header {
                margin-inline: 0.5rem;
            }

            .sidebar {
                width: 200px;
                margin-inline: 0.5rem;
            }

            .main {
                margin-inline: 0.5rem;
            }
        }
    </style>
</head>

                personal_info: 'Personal Info',
                notifications: 'Notifications',
                language_theme: "Language & Appearance",
                delete_account: 'Delete Account',
                back_shop: 'Back to Shop',
                logout: 'Logout',
                orders_title: 'My Orders',
                orders_count_label: 'Orders',
                no_orders: 'No orders yet.',
                start_shopping: 'Start Shopping',
                order_num: 'Order Number',
                order_date: 'Date',
                order_items: 'Items',
                order_total: 'Total',
                view_order_details: 'View Order Details',
                order_status_pending: 'Under Review',
                order_status_shipping: 'Shipping',
                order_status_delivered: 'Delivered',
                order_status_cancelled: 'Cancelled',
                items: 'items',
                sar: 'SAR',
            }
        };

        /* ============================================
           STATE & UTILITIES
           ============================================ */
        let currentLang = localStorage.getItem('lang') || 'ar';
        let currentTheme = localStorage.getItem('theme') || 'dark';

        function t(key) {
            return translations[currentLang]?.[key] || translations.ar[key] || key;
        }

        function applyTheme() {
            if (currentTheme === 'light') {
                document.documentElement.classList.add('light-mode');
            } else {
                document.documentElement.classList.remove('light-mode');
            }
        }

        function applyLanguage() {
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang]?.[key]) {
                    el.textContent = translations[currentLang][key];
                }
            });
            renderOrders();
        }

        function getUserName() {
            return localStorage.getItem('username') || 'مستخدم';
        }

        function isLoggedIn() {
            return localStorage.getItem('isLoggedIn') === 'true';
        }

        function requireAuth() {
            if (!isLoggedIn()) {
                window.location.href = 'login.html';
                return false;
            }
            return true;
        }

        function getOrders() {
            try {
                return JSON.parse(localStorage.getItem('orders') || '[]');
            } catch {
                return [];
            }
        }

        function getStatusText(status) {
            if (status === 'قيد المراجعة' || status === 'pending') return t('order_status_pending');
            if (status === 'قيد الشحن' || status === 'shipping') return t('order_status_shipping');
            if (status === 'تم التوصيل' || status === 'delivered') return t('order_status_delivered');
            if (status === 'ملغي' || status === 'cancelled') return t('order_status_cancelled');
            return status || t('order_status_pending');
        }

        function getStatusClass(status) {
            if (status === 'قيد المراجعة' || status === 'pending') return 'pending';
            if (status === 'قيد الشحن' || status === 'shipping') return 'shipping';
            if (status === 'تم التوصيل' || status === 'delivered') return 'delivered';
            if (status === 'ملغي' || status === 'cancelled') return 'cancelled';
            return 'pending';
        }

        function getOrderItemsInfo(order) {
            const items = order.items || order.products || [];
            const count = items.length;
            const total = order.total || items.reduce((sum, item) => sum + (item.unitPrice || item.price || 0) * (item.quantity || 1), 0);
            const currency = order.currency || t('sar');
            return { count, total, currency };
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString(currentLang === 'ar' ? 'ar' : 'en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
            });
        }

        /* ============================================
           RENDER ORDERS
           ============================================ */
        function renderOrders() {
            const container = document.getElementById('orders-container');
            const countEl = document.getElementById('orders-count');
            const orders = getOrders();

            if (countEl) {
                countEl.textContent = orders.length;
            }

            if (!container) return;

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="ri-shopping-bag-line empty-state__icon"></i>
                        <h2 class="empty-state__title">${t('no_orders')}</h2>
                        <p class="empty-state__desc">${t('no_orders_desc', 'استكشف متجرنا وقم بإنشاء طلبك الأول.')}</p>
                        <a href="shop.html" class="btn-shop">
                            <i class="ri-shopping-cart-2-line"></i>
                            ${t('start_shopping')}
                        </a>
                    </div>
                `;
                return;
            }

            const ordersHTML = orders.map((order, index) => {
                const { count, total, currency } = getOrderItemsInfo(order);
                const statusText = getStatusText(order.status);
                const statusClass = getStatusClass(order.status);
                const orderDate = formatDate(order.createdAt || order.date);
                const orderId = order.orderNumber || order.id || order.orderId || `#${index + 1}`;

                // جمع صور المنتجات (أول 3 فقط)
                const items = order.items || order.products || [];
                const thumbsHTML = items.slice(0, 3).map(item => {
                    const img = item.image || item.imgSrc || item.img || '';
                    return `
                        <div class="order-card__thumb">
                            ${img ? `<img src="${img}" alt="product image" loading="lazy">` : '<i class="ri-box-3-line placeholder"></i>'}
                        </div>
                    `;
                }).join('');

                return `
                    <div class="order-card" style="--i:${index}">
                        <div class="order-card__header">
                            <div class="order-card__number">${orderId}</div>
                            <div class="order-card__date">${orderDate}</div>
                            <span class="order-card__status ${statusClass}">${statusText}</span>
                        </div>
                        <div class="order-card__body">
                            <div class="order-card__items">
                                <div class="order-card__item-thumbs">
                                    ${thumbsHTML}
                                </div>
                                <div class="order-card__info">
                                    <div class="order-card__items-count">${count} ${t('items')}</div>
                                </div>
                            </div>
                            <div class="order-card__total">${total} ${currency}</div>
                            <div class="order-card__actions">
                                <a href="order-details.html?id=${encodeURIComponent(orderId)}" class="btn btn-primary">
                                    <i class="ri-eye-line"></i>
                                    ${t('view_order_details')}
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `<div class="orders-list">${ordersHTML}</div>`;
        }

        // Add missing translation fallback
        translations.ar.no_orders_desc = translations.ar.no_orders_desc || 'استكشف متجرنا وقم بإنشاء طلبك الأول.';
        translations.en.no_orders_desc = translations.en.no_orders_desc || 'Explore our store and create your first order.';

        /* ============================================
           SIDEBAR FUNCTIONALITY
           ============================================ */
        function initSidebar() {
            const usernameDisplay = document.getElementById('user-name-display');
            if (usernameDisplay) {
                usernameDisplay.textContent = getUserName();
            }

            const toggle = document.getElementById('header-toggle');
            const sidebar = document.getElementById('sidebar');
            if (toggle && sidebar) {
                toggle.addEventListener('click', () => {
                    sidebar.classList.toggle('show-sidebar');
                });

                document.addEventListener('click', (e) => {
                    if (!sidebar.contains(e.target) && !toggle.contains(e.target) && window.innerWidth < 1150) {
                        sidebar.classList.remove('show-sidebar');
                    }
                });
            }

            const drops = document.querySelectorAll('.drop');
            drops.forEach(item => {
                const dropBtn = item.querySelector('.drop__button');
                const dropList = item.querySelector('.drop__list');
                if (dropBtn && dropList) {
                    dropBtn.addEventListener('click', () => {
                        const openItem = document.querySelector('.show-drop');
                        if (openItem && openItem !== item) {
                            const openList = openItem.querySelector('.drop__list');
                            openList.removeAttribute('style');
                            openItem.classList.remove('show-drop');
                        }
                        if (item.classList.contains('show-drop')) {
                            dropList.removeAttribute('style');
                            item.classList.remove('show-drop');
                        } else {
                            dropList.style.height = dropList.scrollHeight + 'px';
                            item.classList.add('show-drop');
                        }
                    });
                }
            });

            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.setItem('isLoggedIn', 'false');
                    window.location.href = 'login.html';
                });
            }
        }

        /* ============================================
           INITIALIZATION
           ============================================ */
        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAuth()) return;

            applyTheme();
            applyLanguage();
            initSidebar();

            // Listen for storage changes
            window.addEventListener('storage', (e) => {
                if (e.key === 'theme') {
                    currentTheme = e.newValue || 'dark';
                    applyTheme();
                }
                if (e.key === 'lang') {
                    currentLang = e.newValue || 'ar';
                    applyLanguage();
                }
                if (e.key === 'orders') {
                    renderOrders();
                }
            });
        });
    </script>
</body>
</html>
